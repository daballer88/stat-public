<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blotter Games</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(99, 102, 241, 0.18), transparent 35%),
        linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
      color: #111827;
      min-height: 100vh;
    }

    .page {
      max-width: 950px;
      margin: 0 auto;
      padding: 36px 20px;
    }

    header {
      text-align: center;
      padding: 32px 0 56px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 78px);
      font-weight: 800;
      letter-spacing: -0.07em;
      background: linear-gradient(135deg, #111827, #2563eb, #14b8a6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-top: 12px;
      color: #6b7280;
      font-size: 17px;
    }

    .app-section {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 34px;
      padding: 46px 28px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(17, 24, 39, 0.08);
      backdrop-filter: blur(14px);
    }

    .app-icon {
      width: 190px;
      height: 190px;
      border-radius: 42px;
      object-fit: cover;
      display: block;
      margin: 0 auto 28px;
      box-shadow: 0 22px 45px rgba(17, 24, 39, 0.18);
    }

    .app-section h2 {
      margin: 0;
      font-size: clamp(40px, 7vw, 74px);
      line-height: 0.95;
      font-weight: 850;
      letter-spacing: -0.07em;
    }

    .app-section h2 span {
      display: block;
      color: #2563eb;
    }

    .bubbles {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      max-width: 720px;
      margin: 34px auto 32px;
    }

    .bubble {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 12px 16px;
      color: #374151;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(17, 24, 39, 0.05);
    }

    .app-store-button {
      display: inline-block;
      background: #111827;
      color: #ffffff;
      text-decoration: none;
      padding: 15px 22px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 16px;
      transition: 0.2s ease;
    }

    .app-store-button:hover {
      background: #000000;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid #dbe3ef;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      color: #6b7280;
      font-size: 14px;
    }

    footer a {
      color: #374151;
      text-decoration: none;
      font-weight: 500;
      margin-left: 16px;
    }

    footer a:hover {
      color: #111827;
    }

    @media (max-width: 640px) {
      .page {
        padding: 24px 16px;
      }

      header {
        padding-bottom: 36px;
      }

      .app-section {
        padding: 34px 18px;
        border-radius: 28px;
      }

      .app-icon {
        width: 150px;
        height: 150px;
        border-radius: 34px;
      }

      footer {
        text-align: center;
        justify-content: center;
      }

      footer a {
        margin: 0 8px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <h1>Blotter Games</h1>
      <div class="subtitle">Medical minigames made simple.</div>
    </header>

    <main>
      <section class="app-section">
        <img
          id="appIcon"
          class="app-icon"
          src=""
          alt="Stat! - Medical Minigames app icon"
        />

        <h2>
          Stat!
          <span>Medical Minigames</span>
        </h2>

        <div class="bubbles">
          <div class="bubble">Enhance your medical learning</div>
          <div class="bubble">Make studying feel fun</div>
          <div class="bubble">Keep your thinking sharp</div>
          <div class="bubble">Quick clinical practice</div>
          <div class="bubble">Built for medical learners</div>
        </div>

        <a
          class="app-store-button"
          href="https://apps.apple.com/us/app/stat-medical-minigames/id6764444936"
          target="_blank"
          rel="noopener"
        >
          View on App Store
        </a>
      </section>
    </main>

    <footer>
      <div>© <span id="year"></span> Blotter Games</div>

      <div>
        <a href="https://blottergames.com/privacypolicy.html">Privacy Policy</a>
        <a href="https://blottergames.com/supportfile.html">Support</a>
        <a href="mailto:stat@blottergames.com">Contact Us</a>
      </div>
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    fetch("https://itunes.apple.com/lookup?id=6764444936&country=us")
      .then(response => response.json())
      .then(data => {
        const app = data.results && data.results[0];

        if (app && app.artworkUrl512) {
          document.getElementById("appIcon").src = app.artworkUrl512;
        } else {
          document.getElementById("appIcon").style.display = "none";
        }
      })
      .catch(() => {
        document.getElementById("appIcon").style.display = "none";
      });
  </script>
</body>
</html>
